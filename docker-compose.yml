# Apache (déjà présent sur le serveur) assure HTTPS + mot de passe devant ArIès :
# voir deploy/apache/aries.conf. Seul 127.0.0.1:3050 est publié.
# Plafonds CPU/RAM : Apache, codex et PostgreSQL gardent toujours de quoi tourner.
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/${LLM_MODEL_FILE:-Qwen3-8B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      # Mesuré (llama-bench) : 6 threads est l'optimum pour Qwen3-8B sur ces vCPU partagés
      # (4 ou 5 : plus lent ; 8 : effondrement). Voir docs/benchmarks.md.
      - -t
      - "6"
      - --jinja
      # Pas de phase de « réflexion » : sur CPU, elle ajouterait des dizaines de secondes.
      - --reasoning-budget
      - "0"
    volumes:
      - ./models:/models:ro
    cpus: 6
    mem_limit: 8g
    restart: unless-stopped

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/${EMBEDDING_MODEL_FILE:-bge-m3-q8_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --embeddings
      - -c
      - "2048"
      - -b
      - "2048"
      - -ub
      - "2048"
      - -t
      - "2"
    volumes:
      - ./models:/models:ro
    cpus: 2
    mem_limit: 1536m
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    cpus: 1
    mem_limit: 1g
    restart: unless-stopped

  # Méta-moteur de recherche (AGPL : service séparé, aucun port publié).
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?définir SEARXNG_SECRET dans .env}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped

  # Navigateur headless (Playwright MCP, Apache-2.0). Réseau `browser` seulement : les
  # pages visitées n'atteignent ni ArIès (API sans mot de passe en interne), ni llama.cpp,
  # ni Qdrant, ni SearXNG. ArIès lui parle via le relais `browser-gateway`.
  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    init: true
    entrypoint: ["node", "/app/cli.js"]
    command:
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --isolated
      - --host
      - 0.0.0.0
      - --port
      - "8931"
      - --allowed-hosts
      - browser-gateway:8931
    networks:
      - browser
    cpus: 1
    mem_limit: 1g
    restart: unless-stopped

  # Relais TCP à destination fixe (socat, GPL : service séparé) : le seul conteneur
  # présent sur les deux réseaux, il ne sait joindre que Playwright.
  browser-gateway:
    image: alpine/socat:latest
    command: ["TCP-LISTEN:8931,fork,reuseaddr", "TCP:playwright:8931"]
    networks:
      - default
      - browser
    depends_on:
      - playwright
    cpus: 0.25
    mem_limit: 32m
    restart: unless-stopped

  # Serveur MCP Notion officiel (MIT), version figée. NOTION_TOKEN : jeton d'intégration ;
  # NOTION_MCP_AUTH_TOKEN : secret partagé avec ArIès (réseau interne, aucun port publié).
  notion:
    image: node:22-alpine
    command:
      - npx
      - -y
      - "@notionhq/notion-mcp-server@2.5.2"
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      AUTH_TOKEN: ${NOTION_MCP_AUTH_TOKEN:-}
    volumes:
      - npm_cache:/root/.npm
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  # Gmail et Agenda (google_workspace_mcp, MIT), construit depuis un commit figé.
  # Mono-utilisateur : le jeton OAuth (volume google_creds) est obtenu une fois via
  # http://localhost:8000/oauth2callback, joint par un tunnel SSH (aucun port publié).
  google:
    build: https://github.com/taylorwilsdon/google_workspace_mcp.git#789730452b9c5452b2c8d348cf005d196c12ba4e
    entrypoint: ["/app/.venv/bin/python", "main.py"]
    command:
      - --transport
      - streamable-http
      - --single-user
      - --permissions
      - gmail:send
      - calendar:full
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL:-}
      MCP_SINGLE_USER_MODE: "1"
      WORKSPACE_MCP_HOST: 0.0.0.0
      WORKSPACE_MCP_PORT: "8000"
      WORKSPACE_MCP_BASE_URI: http://localhost
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8000/oauth2callback
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      WORKSPACE_MCP_CREDENTIALS_DIR: /app/store_creds
    volumes:
      - google_creds:/app/store_creds
    cpus: 0.5
    mem_limit: 384m
    restart: unless-stopped

  aries:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3050:3050"
    cpus: 1
    mem_limit: 512m
    depends_on:
      - llm
      - embeddings
      - qdrant
      - searxng
      - browser-gateway
      - notion
      - google
    restart: unless-stopped

networks:
  browser:

volumes:
  qdrant_data:
  npm_cache:
  google_creds:
