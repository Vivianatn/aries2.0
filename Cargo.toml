[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
aries-core = { path = "crates/aries-core" }
aries-governance = { path = "crates/aries-governance" }
aries-llm = { path = "crates/aries-llm" }
aries-memory = { path = "crates/aries-memory" }
aries-proactive = { path = "crates/aries-proactive" }
aries-tools = { path = "crates/aries-tools" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
# Expressions cron (gère l'heure d'été), avec jiff.
croner = { version = "4", default-features = false, features = ["jiff"] }
dom_smoothie = "0.18"
eventsource-stream = "0.2"
futures = "0.3"
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "rustls"] }
# Client MCP seul, en HTTP (les serveurs MCP tournent dans leurs propres conteneurs).
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time", "sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
