# Virtual host d'ArIès, à côté de codex et du site principal (sans les modifier).
# Installation : deploy/apache/install.sh (certbot ajoute ensuite la version HTTPS).
<VirtualHost *:80>
    ServerName aries.antoine-vivian.fr

    <Location />
        AuthType Basic
        AuthName "ArIes"
        AuthUserFile /etc/apache2/aries.htpasswd
        Require valid-user
    </Location>
    # Renouvellement Let's Encrypt : pas de mot de passe ni de proxy sur ce chemin.
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>
    ProxyPass /.well-known/acme-challenge/ !

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # flushpackets : chaque fragment de réponse part tout de suite (streaming SSE).
    ProxyPass        / http://127.0.0.1:3050/ flushpackets=on timeout=600 upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3050/
    SetEnvIf Request_URI "^/api/v1/chat" no-gzip=1

    ErrorLog ${APACHE_LOG_DIR}/aries_error.log
    CustomLog ${APACHE_LOG_DIR}/aries_access.log combined
</VirtualHost>
